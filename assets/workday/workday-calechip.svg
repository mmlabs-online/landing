    <path d="M572 170l6 14 16 2-12 10 4 16-14-9-14 9 4-16-12-10 16-2z" fill="#FFFFFF"/>
    <path d="M40 390c10-10 20 10 30 0s20 10 30 0" fill="none" stroke="#5B9BF0"/>
