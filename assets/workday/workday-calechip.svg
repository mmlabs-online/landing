    <rect width="652" height="440" rx="52" fill="#FFF1CF" stroke="none"/>
    <circle cx="560" cy="70" r="90" fill="#FFF8E4" stroke="none"/>

    <!-- calendar window -->
    <rect x="78" y="68" width="440" height="300" rx="30" fill="#1A2442" stroke="none"/>
