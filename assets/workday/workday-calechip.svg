    <circle cx="100" cy="86" r="6" fill="#FFFFFF" stroke="none"/><circle cx="120" cy="86" r="6" fill="#FFFFFF" stroke="none"/><circle cx="140" cy="86" r="6" fill="#FFFFFF" stroke="none"/>
    <rect x="390" y="78" width="96" height="16" rx="8" fill="#FFF1CF" stroke="none"/>

    <!-- day columns -->
