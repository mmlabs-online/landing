    <rect x="452" y="296" width="116" height="52" rx="26" fill="#1A2442" stroke="none" transform="translate(5,5)"/>
    <rect x="452" y="296" width="116" height="52" rx="26" fill="#FFFFFF"/>
    <circle cx="480" cy="322" r="14" fill="#F2B233"/><path d="M480 314v16M472 322h16" stroke-width="3.5"/>
    <rect x="502" y="316" width="50" height="12" rx="6" fill="#E8EBF3" stroke="none"/>

