      <rect x="92" y="128" width="72" height="18" rx="9"/><rect x="175" y="128" width="72" height="18" rx="9"/>
      <rect x="258" y="128" width="72" height="18" rx="9" fill="#F2B233"/><rect x="341" y="128" width="72" height="18" rx="9"/><rect x="424" y="128" width="72" height="18" rx="9"/>
    </g>
    <path d="M170 156v188M253 156v188M336 156v188M419 156v188" stroke="#E8EBF3" stroke-width="3"/>

