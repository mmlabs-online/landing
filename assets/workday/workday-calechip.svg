    <rect x="94" y="164" width="68" height="54" rx="14" fill="#DCEBFF"/>
    <rect x="94" y="264" width="68" height="40" rx="14" fill="#E9E1FF"/>
    <rect x="177" y="200" width="68" height="70" rx="14" fill="#D5F3E6"/>
    <rect x="260" y="164" width="68" height="40" rx="14" fill="#FFDCE5"/>
    <rect x="260" y="224" width="68" height="100" rx="14" fill="#F2B233"/>
    <path d="M275 250h38M275 266h26" stroke="#1A2442" stroke-width="4"/>
    <rect x="343" y="180" width="68" height="60" rx="14" fill="#DCEBFF"/>
    <rect x="426" y="164" width="68" height="44" rx="14" fill="#FFDCE5"/>
    <rect x="426" y="252" width="68" height="60" rx="14" fill="#E9E1FF"/>

