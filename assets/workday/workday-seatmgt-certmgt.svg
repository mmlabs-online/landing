<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 652 440" width="652" height="440">
  <title>SeatMGT and CertTracker – keep things in order</title>
  <g stroke="#1A2442" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect width="652" height="440" rx="52" fill="#D5F3E6" stroke="none"/>
    <circle cx="560" cy="380" r="100" fill="#E6F8EF" stroke="none"/>

    <!-- SeatMGT: floor plan card -->
    <rect x="58" y="70" width="300" height="290" rx="28" fill="#1A2442" stroke="none"/>
    <rect x="50" y="62" width="300" height="290" rx="28" fill="#FFFFFF"/>
    <path d="M52 108a26 26 0 0124-44h248a26 26 0 0124 44z" fill="#DCEBFF" stroke="none"/>
    <path d="M50 108h300"/>
    <circle cx="80" cy="86" r="6" fill="#1A2442" stroke="none"/><rect x="96" y="80" width="90" height="12" rx="6" fill="#1A2442" stroke="none"/>

    <!-- rooms -->
    <rect x="72" y="126" width="120" height="96" rx="16" fill="#F4F6FC"/>
    <rect x="208" y="126" width="120" height="96" rx="16" fill="#F4F6FC"/>
    <rect x="72" y="236" width="256" height="96" rx="16" fill="#F4F6FC"/>
    <!-- desks -->
    <g fill="#FFFFFF">
      <rect x="88" y="146" width="36" height="24" rx="6"/><rect x="140" y="146" width="36" height="24" rx="6"/>
      <rect x="88" y="182" width="36" height="24" rx="6"/><rect x="140" y="182" width="36" height="24" rx="6" fill="#D5F3E6"/>
      <rect x="224" y="146" width="36" height="24" rx="6" fill="#FFDCE5"/><rect x="276" y="146" width="36" height="24" rx="6"/>
      <rect x="224" y="182" width="36" height="24" rx="6"/><rect x="276" y="182" width="36" height="24" rx="6"/>
    </g>
    <!-- device on long desk -->
    <rect x="96" y="262" width="92" height="50" rx="10" fill="#FFFFFF"/>
    <rect x="106" y="270" width="72" height="30" rx="6" fill="#DCEBFF" stroke="none"/>
    <path d="M124 312h36"/>
    <rect x="214" y="266" width="30" height="46" rx="8" fill="#FFFFFF"/><circle cx="229" cy="302" r="3" fill="#1A2442" stroke="none"/>
    <rect x="262" y="276" width="46" height="36" rx="8" fill="#F2B233"/>
    <!-- pin -->
    <path d="M158 160s-20-18-20-34a20 20 0 0140 0c0 16-20 34-20 34z" fill="#5B9BF0" transform="translate(0,-6)"/>
    <circle cx="158" cy="120" r="7" fill="#FFFFFF"/>

    <!-- CertTracker: certificate card (tilted) -->
    <g transform="rotate(5 490 200)">
      <rect x="398" y="92" width="200" height="236" rx="26" fill="#1A2442" stroke="none"/>
      <rect x="390" y="84" width="200" height="236" rx="26" fill="#FFFFFF"/>
      <circle cx="490" cy="148" r="34" fill="#4CC39A"/>
      <path d="M476 148l10 10 18-20" stroke="#FFFFFF" stroke-width="5"/>
      <path d="M470 178l-10 36 30-14 30 14-10-36" fill="#FF8FAB"/>
      <circle cx="490" cy="148" r="34" fill="none"/>
      <rect x="418" y="230" width="144" height="12" rx="6" fill="#1A2442" stroke="none"/>
      <!-- skill bars -->
      <rect x="418" y="256" width="144" height="14" rx="7" fill="#F4F6FC" stroke="none"/><rect x="418" y="256" width="110" height="14" rx="7" fill="#F2B233" stroke="none"/>
      <rect x="418" y="280" width="144" height="14" rx="7" fill="#F4F6FC" stroke="none"/><rect x="418" y="280" width="70" height="14" rx="7" fill="#9A7BF0" stroke="none"/>
    </g>

    <!-- doodles -->
    <path d="M600 60l6 14 16 2-12 10 4 16-14-9-14 9 4-16-12-10 16-2z" fill="#F2B233"/>
    <path d="M30 390c10-10 20 10 30 0s20 10 30 0" fill="none" stroke="#5B9BF0"/>
    <path d="M380 52v18M371 61h18" stroke="#9A7BF0"/>
    <circle cx="378" cy="390" r="7" fill="#FF8FAB" stroke="none"/>
  </g>
</svg>
