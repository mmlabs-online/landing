name: runner-check

# Run by hand from the Actions tab to prove the self-hosted Mac runner (label mmlabs-mac) picks up a
# job, is not running as root, and reaches Docker. Run it after registering the runner and after the
# Mac restarts. workflow_dispatch only. Modelled on CaleChip's runner-check draft.

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: [self-hosted, macOS, mmlabs-mac]
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: docker on PATH
        run: |
          for d in /opt/homebrew/bin /usr/local/bin /Applications/Docker.app/Contents/Resources/bin "$HOME/.orbstack/bin"; do
            if [ -d "$d" ]; then echo "$d" >> "$GITHUB_PATH"; fi
          done

      - name: identity
        run: |
          echo "runner: $RUNNER_NAME  host: $(hostname)  user: $(id -un)  arch: $(uname -m)  macOS: $(sw_vers -productVersion)"
          if [ "$(id -u)" = "0" ]; then
            echo "::error::The runner is running as root. Install it as a normal user (docs/ops/ci-cd.md § Mac runner)."
            exit 1
          fi

      - name: docker
        run: |
          docker version --format 'docker client {{.Client.Version}}, server {{.Server.Version}} ({{.Server.Os}}/{{.Server.Arch}})'
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'

      - name: site
        run: |
          if curl -fsS -o /dev/null http://127.0.0.1:3000/; then
            echo "http://127.0.0.1:3000/ answers 200"
          else
            echo "::warning::Nothing answers on http://127.0.0.1:3000/ yet. The first release deploy starts it."
          fi
