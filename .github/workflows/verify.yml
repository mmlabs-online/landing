name: verify

# The pull-request gate: the site builds, every {{...}} token was filled, and every app and blog page
# listed in apps.json and blog/posts.json was written. No secrets, no Docker, GitHub-hosted only:
# pull request code never reaches the self-hosted Mac runner.

on:
  pull_request:
    branches: [main, "release/**"]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: build
        run: python3 build.py

      - name: no unfilled tokens
        run: |
          if grep -rnE '\{\{(url|page):[A-Za-z0-9_-]+\}\}|\{\{(social|email|home|posts)\}\}' dist; then
            echo "::error::The pages above still hold a template token. Check the slug against apps.json."
            exit 1
          fi

      - name: every page was written
        run: |
          python3 - <<'EOF'
          import json, pathlib, sys
          apps = json.load(open("apps.json"))["apps"]
          posts = json.load(open("blog/posts.json"))["posts"]
          want = ["index.html"]
          want += [f"apps/{a['slug']}/index.html" for a in apps if a.get("detail", True)]
          want += [f"blog/{p['slug']}/index.html" for p in posts]
          missing = [w for w in want if not (pathlib.Path("dist") / w).is_file()]
          for m in missing:
              print(f"::error::dist/{m} was not written")
          print(f"{len(want) - len(missing)}/{len(want)} pages present")
          sys.exit(1 if missing else 0)
          EOF
