name: release

# Every push to a release/** branch builds the site image once, smoke-tests it, pushes it to Docker
# Hub, and then deploys that exact image (by digest) on the self-hosted Mac runner labelled
# mmlabs-mac. If the new container is not healthy, the previous one is started again. Modelled on
# CaleChip's build-image workflow and its deploy-calechip draft. docs/ops/ci-cd.md is the runbook.
#
# Cut a release:   git switch -c release/<name> main && git push -u origin release/<name>
# Each later push to that branch is a new build and a new deploy.
#
# NEEDS, added by the operator under Settings → Secrets and variables → Actions:
#   secrets   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN — read/write on the IMAGE repository below
#   runner    a self-hosted macOS runner with the label mmlabs-mac (docs/ops/ci-cd.md § Mac runner)
#
# Only `push` starts this workflow, never `pull_request`: code that is not on a branch of this
# repository must never run on the Mac.

on:
  push:
    branches: ["release/**"]

permissions:
  contents: read

env:
  # Docker Hub repository. Its owner must be the DOCKERHUB_USERNAME account.
  IMAGE: mingming21400/mmlabs-site

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One build per commit; a later push never cancels an earlier build.
    concurrency:
      group: build-image-${{ github.sha }}
      cancel-in-progress: false
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: secrets present
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=""
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing Actions secrets:$missing — add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ "${IMAGE%%/*}" != "$DOCKERHUB_USERNAME" ]; then
            echo "::error::IMAGE is $IMAGE but DOCKERHUB_USERNAME is another account. Change IMAGE at the top of release.yml."
            exit 1
          fi

      - name: tag
        id: tag
        run: |
          # release/2026-10-28 -> release-2026-10-28, a readable second tag next to sha-<7>.
          branch="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-100)"
          {
            echo "version=sha-${GITHUB_SHA::7}"
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${GITHUB_SHA::7}"
            echo "${IMAGE}:${branch}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # arm64 for an Apple silicon Mac, amd64 for an Intel Mac or a Linux server.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build (amd64, for the smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: mmlabs-site:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test
        run: |
          docker run -d --name smoke -p 3000:3000 mmlabs-site:smoke
          ok=""
          for i in $(seq 1 30); do
            if [ "$(curl -fsS http://127.0.0.1:3000/healthz 2>/dev/null)" = "ok" ]; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "::error::Smoke test failed: /healthz did not answer ok within 30s."
            docker logs smoke
            exit 1
          fi
          # The home page, every app page and every blog post must answer 200.
          paths="$(python3 -c '
          import json
          print("/")
          for a in json.load(open("apps.json"))["apps"]:
              if a.get("detail", True): print("/apps/%s/" % a["slug"])
          for p in json.load(open("blog/posts.json"))["posts"]: print("/blog/%s/" % p["slug"])
          ')"
          failed=""
          for p in $paths; do
            curl -fsS -o /dev/null "http://127.0.0.1:3000$p" || failed="$failed $p"
          done
          if [ -n "$failed" ]; then
            echo "::error::Smoke test failed: these pages did not answer 200:$failed"
            exit 1
          fi
          echo "healthz ok after ${i}s; $(echo "$paths" | wc -l | tr -d ' ') pages answered 200"

      - name: remove smoke container
        if: always()
        run: docker rm -f smoke || true

      # Same Dockerfile and build cache as the smoke build, so amd64 is not rebuilt; arm64 is added.
      - name: push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tag.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: summary
        env:
          TAGS: ${{ steps.tag.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Image"
            echo ""
            while read -r t; do echo "- \`$t\`"; done <<< "$TAGS"
            echo "- Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build-image
    runs-on: [self-hosted, macOS, mmlabs-mac]
    # Add required reviewers to the prod environment (Settings → Environments) to approve each deploy.
    environment: prod
    timeout-minutes: 15
    # One deploy at a time across all release branches; a running deploy is never cancelled.
    concurrency:
      group: deploy-mmlabs-site
      cancel-in-progress: false
    env:
      DIGEST: ${{ needs.build-image.outputs.digest }}
      VERSION: ${{ needs.build-image.outputs.version }}
      # Same name and port as the README's docker run, so a container started by hand is replaced.
      # cloudflared on the Mac points mmlabs.online at http://localhost:3000.
      CONTAINER: mmlabs-home
      PORT: "3000"
    defaults:
      run:
        shell: bash
    steps:
      - name: docker on PATH
        run: |
          # A runner started by launchd gets a minimal PATH. Add the usual Docker locations on macOS
          # (Homebrew on Apple silicon and Intel, Docker Desktop, OrbStack).
          for d in /opt/homebrew/bin /usr/local/bin /Applications/Docker.app/Contents/Resources/bin "$HOME/.orbstack/bin"; do
            if [ -d "$d" ]; then echo "$d" >> "$GITHUB_PATH"; fi
          done

      - name: image
        run: |
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::build-image passed no digest ('$DIGEST'). Nothing was deployed."
            exit 1
          fi
          echo "REF=${IMAGE}@${DIGEST}" >> "$GITHUB_ENV"

      - name: docker ready
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "::error::Docker is not running on $(hostname) for user $(id -un). Start Docker Desktop (or OrbStack/Colima) and re-run this job."
            exit 1
          fi
          echo "runner $RUNNER_NAME, user $(id -un), $(uname -m), docker $(docker version --format '{{.Server.Version}}')"

      - name: pull
        run: docker pull "$REF"

      - name: deploy
        id: deploy
        run: |
          # $1 = path to probe, $2 = expected body ("" = any 200). 60 tries, 1s apart.
          healthy() {
            for _ in $(seq 1 60); do
              body="$(curl -fsS "http://127.0.0.1:${PORT}$1" 2>/dev/null)" && { [ -z "$2" ] || [ "$body" = "$2" ]; } && return 0
              sleep 1
            done
            return 1
          }
          start() {
            docker run -d --name "$CONTAINER" --restart unless-stopped -p "${PORT}:3000" \
              --label org.mmlabs.release="$GITHUB_REF_NAME" --label org.mmlabs.version="$VERSION" "$1" >/dev/null
          }

          previous=""
          if docker container inspect "$CONTAINER" >/dev/null 2>&1; then
            previous="$(docker container inspect -f '{{.Image}}' "$CONTAINER")"
            docker rm -f "${CONTAINER}-prev" >/dev/null 2>&1 || true
            docker stop "$CONTAINER" >/dev/null
            docker rename "$CONTAINER" "${CONTAINER}-prev"
          fi

          if start "$REF" && healthy /healthz ok; then
            docker rm -f "${CONTAINER}-prev" >/dev/null 2>&1 || true
            result=deployed
          else
            echo "::group::logs of the failed container"
            docker logs "$CONTAINER" 2>&1 | tail -n 50 || true
            echo "::endgroup::"
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
            if [ -z "$previous" ]; then
              result=no-previous
            else
              docker rename "${CONTAINER}-prev" "$CONTAINER"
              docker start "$CONTAINER" >/dev/null
              # An image from before this workflow has no /healthz, so the restore only needs a 200 on /.
              if healthy / ""; then result=restored; else result=restore-failed; fi
            fi
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          [ "$result" = deployed ]

      - name: clean up old images
        if: success()
        run: |
          # Unused mmlabs-site images only; the running one is kept. A rollback pulls by digest again.
          docker image prune -af --filter "label=org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" >/dev/null || true

      - name: summary
        if: always()
        env:
          RESULT: ${{ steps.deploy.outputs.result }}
          PREVIOUS: ${{ steps.deploy.outputs.previous }}
        run: |
          case "$RESULT" in
            deployed)       msg="deployed: \`$REF\` is running on $(hostname) and healthy." ;;
            restored)       msg="restored: \`$REF\` failed its health check; the previous image \`$PREVIOUS\` is running again." ;;
            no-previous)    msg="no-previous: \`$REF\` failed its health check and nothing was running before it. The site is down." ;;
            restore-failed) msg="restore-failed: \`$REF\` failed its health check and so did the previous image. The site is down and needs a hand on the Mac." ;;
            *)              msg="did-not-complete: the deploy stopped before the swap (see the failed step). The running container was not touched." ;;
          esac
          { echo "### Deploy ($GITHUB_REF_NAME)"; echo ""; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"
          echo "$msg"
